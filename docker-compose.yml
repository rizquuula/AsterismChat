services:
  postgres:
    image: postgres:16-alpine
    container_name: asterism_chat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: asterismchat
      POSTGRES_PASSWORD: asterismchat_password
      POSTGRES_DB: asterism_chat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterismchat -d asterism_chat_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asterism-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: asterism_chat_server
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://asterismchat:asterismchat_password@postgres:5432/asterism_chat_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - asterism-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asterism_chat_web
    restart: unless-stopped
    networks:
      - asterism-network

  nginx:
    image: nginx:alpine
    container_name: asterism_chat_nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - asterism-network

networks:
  asterism-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
